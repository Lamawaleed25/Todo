<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="./script.js" defer></script>
    <title>To-Do List web app</title>
  </head>
  <body>
    <section class="Todo">
      <h1>TO DO LIST</h1>
      <h4>What Do You Wanna Do Today?</h4>
      <div class="input">
        <input
          type="text"
          class="inputfield"
          id="taskInput"
          placeholder="Please Enter a task"
        />
        <button class="button" id="addTask">Add To List</button>
      </div>

      <ul class="scroll">
        <li id="todoList"></li>
      </ul>
      <div>
        <hr class="counter" />
        <div class="countercontainer">
          <p><span id="counter">0</span> Total Tasks</p>

          <button class="delete" id="deleteAll">Delete All</button>
        </div>
      </div>
    </section>
    <footer>
      <div class="footer">
        <p class="madeby">Made By</p>
        <p class="name">Lama</p>
      </div>
    </footer>
  </body>
</html>
